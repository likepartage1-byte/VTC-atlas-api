version: '3.8'

services:
  mysql-local:
    image: mysql:8.0
    container_name: atlas-mysql-local
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: atlas_local
    volumes:
      - mysql_local_data:/var/lib/mysql

  redis-local:
    image: redis:7-alpine
    container_name: atlas-redis-local
    ports:
      - "6379:6379"

volumes:
  mysql_local_data:
